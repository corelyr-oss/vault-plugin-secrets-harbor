name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      packages: write     # push to GHCR
      id-token: write     # Sigstore keyless signing
      attestations: write # GitHub artifact attestations
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance (archives + checksums)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify signatures & smoke test
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.release.outputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$TAG" --repo "$REPO" \
            --pattern 'SHA256SUMS*' --pattern "*_${VERSION}_linux_amd64.tar.gz" --dir dist
          ls -la dist
      - name: Verify checksums signature (keyless)
        run: |
          cd dist
          cosign verify-blob \
            --certificate SHA256SUMS.pem --signature SHA256SUMS.sig \
            --certificate-identity-regexp="^https://github.com/${REPO}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            SHA256SUMS
          sha256sum --ignore-missing -c SHA256SUMS
      - name: Verify image signature (keyless)
        run: |
          cosign verify "ghcr.io/${REPO}:${VERSION}" \
            --certificate-identity-regexp="^https://github.com/${REPO}/" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            -o text
      - name: Smoke test - register released binary by SHA256 in Vault
        run: |
          set -euo pipefail
          mkdir -p plugins
          tar -xzf dist/*_linux_amd64.tar.gz -C plugins vault-plugin-secrets-harbor
          SHA=$(sha256sum plugins/vault-plugin-secrets-harbor | cut -d' ' -f1)
          echo "binary reports: $(plugins/vault-plugin-secrets-harbor -version)"
          docker run -d --name vault --cap-add=IPC_LOCK \
            -e VAULT_DEV_ROOT_TOKEN_ID=root -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            -e VAULT_LOCAL_CONFIG='{"plugin_directory":"/plugins"}' \
            -v "$PWD/plugins:/plugins:ro" -p 8200:8200 hashicorp/vault:latest server -dev
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8200/v1/sys/health >/dev/null && break; sleep 1; done
          export VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault plugin register -sha256="$SHA" -version="$TAG" secret vault-plugin-secrets-harbor
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault secrets enable -path=harbor vault-plugin-secrets-harbor
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault secrets list -detailed | grep harbor
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault path-help harbor/ | head -5
          # Unconfigured mount must answer sensibly (no Harbor available here).
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault read harbor/config || true
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault write harbor/config url=http://harbor.invalid username=x password=y verify_connection=false
          docker exec -e VAULT_ADDR -e VAULT_TOKEN vault vault read harbor/config
      - name: Smoke test - OCI image runs and reports version
        run: |
          docker run --rm "ghcr.io/${REPO}:${VERSION}" -version | tee out.txt
          grep -q "$TAG" out.txt
